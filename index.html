    <script>
      // Gracefully ignore WebSocket HMR connection failures in preview environments per AI Studio guidelines
      window.addEventListener(
        'unhandledrejection',
        function (e) {
          var msg = e && e.reason && typeof e.reason.message === 'string' ? e.reason.message : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('vite:ws') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
