    <script>
      // Gracefully ignore WebSocket HMR connection failures in preview environments per AI Studio guidelines
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (typeof e.reason.message === 'string' &&
            (e.reason.message.includes('WebSocket') ||
             e.reason.message.includes('closed without opened') ||
             e.reason.message.includes('vite:ws')))
        ) {
          e.preventDefault();
        }
      });
    </script>
